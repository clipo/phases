[project]
name = "mls-emergence"
version = "0.1.0"
description = "An operational criterion for emergent group-level structure, tested with central Mississippi Valley ceramic transmission data"
requires-python = ">=3.11"
dependencies = [
    # Pinned below 2.5 on 2026-10-31 (author ruling). NumPy 2.5 changed the
    # draw Generator.multinomial returns from a given state, so the three
    # tests in tests/phasecheck/test_copying_model.py that pin the paper's
    # reported numbers fail under 2.5.4 and pass under 2.4.6 and earlier
    # (diagnosis: docs/working/2026-10-19-numpy-diagnosis/). Regenerating
    # every seeded result under 2.5 is a separate task, not done; see
    # docs/METHODS_DECISIONS.md, entry of 2026-10-31. Beau's branch analyses
    # (per-class, regional-drift and rim tables) were produced under 2.5.4
    # and are quoted as committed.
    "numpy>=1.26,<2.5",
    "scipy>=1.12",
    "pandas>=2.0",
    "openpyxl>=3.1",
    # Legacy .xls reader. data/raw/14CDatesFromMainfort2001.xls is the old
    # binary format, which openpyxl cannot read; pandas dispatches to xlrd.
    # Undeclared until 2026-08-31, when two tests failed on a clean install.
    "xlrd>=2.0.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pymc>=6.1",
    "arviz>=1.2",
    "h5netcdf>=1.3",
    # h5netcdf dispatches to h5py for the actual HDF5 backend; without it
    # idata.to_netcdf() raises and the posterior is never persisted, while the
    # markdown report is written first and so looks like a clean run.
    # Undeclared until 2026-08-31.
    "h5py>=3.10",
    # Spatial stack. Added 2026-08-31: these were imported by
    # analyses/16_basin_membership.py (which writes the canonical basin
    # membership every downstream analysis reads), analyses/30_regional_map.py
    # and analyses/make_map.py, but were never declared, so `pip install -e .`
    # produced an environment that could not regenerate the basin. System
    # libgeos 3.12 and libproj 9.4 are present on the build host.
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "cartopy>=0.23",
]

# monument-mls (the parent model) is a path dependency installed editable, not
# pinned here to avoid a brittle relative file URL:
#     pip install -e ../monument-mls
# It exposes `signaling.emergence` and `signaling.price_equation`.

[project.optional-dependencies]
spatial = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.4",
    "cartopy>=0.22",
    "xlrd>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mls_emergence", "src/phasecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: touches local gitignored research data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Intentional style choices in this research codebase:
#   E402  import not at top  - scripts set the Matplotlib backend and sys.path
#                              before importing project modules.
#   E701  multiple statements on one line (colon)  - terse guards, e.g.
#                              `if n == 0: return 0.0`.
#   E702  multiple statements on one line (semicolon)  - paired short
#                              assignments, e.g. `c = arr; n = c.sum()`.
#   RUF046 int(round(x))  - x is often a NumPy scalar, and round() returns a
#                              Python int for one only under NumPy >= 2, while
#                              the floor here is numpy>=1.26.
ignore = ["E402", "E701", "E702", "RUF046"]

[project.scripts]
phasecheck = "phasecheck.cli:main"
